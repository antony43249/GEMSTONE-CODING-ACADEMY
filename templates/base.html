{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Gemstone Academy{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{% static 'custom.css' %}">
</head>
<body class="d-flex flex-column min-vh-100">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <a class="navbar-brand">🌟 Gemstone Academy</a>
    
    <!-- Toggler button for small screens -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Collapsible content -->
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link text-white" href="/">Home</a></li>
        <li class="nav-item"><a class="nav-link text-white" href="/users/">Users</a></li>
        <li class="nav-item"><a class="nav-link text-white" href="/courses/">Courses</a></li>
        <li class="nav-item"><a class="nav-link text-white" href="/enrollments/">Enrollments</a></li>
        <li class="nav-item"><a class="nav-link text-white" href="/projects/">Projects</a></li>
        <li class="nav-item"><a class="nav-link text-white" href="/payments/">Payments</a></li>
        <li class="nav-item"><a class="nav-link text-white" href="/marketing/">Marketing</a></li>
      </ul>
    </div>
  </nav>

  <!-- Page Content -->
  <div>
    {% block content %}
    {% endblock %}
  </div>

  <footer class="bg-secondary mt-auto py-3 text-center">
          <p class="mb-0 text-light">© 2025 Gemstone Coding Academy | Developed by Eng. Odadi</p>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
